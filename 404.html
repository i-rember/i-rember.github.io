    <script>
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        document.addEventListener("DOMContentLoaded", () => {
            const tags = document.querySelectorAll("flicker");
            async function update(t) {
                for (const tag of tags) {
                    var rep = "";
                    for (let i = 0; i < tag.textContent.length; i++) {
                        if (Math.random() < 0.02) rep += " ";
                        else rep += "?";
                    }
                    tag.textContent = rep;
                }
                await sleep(100);
                requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        })
    </script>
